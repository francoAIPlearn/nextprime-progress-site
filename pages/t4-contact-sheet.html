<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>测试4 Contact Sheet | NEXTPRIME</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .top-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .sheet-switch { display: inline-flex; flex-wrap: wrap; gap: 8px; }
    .sheet-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
    }
    .sheet-btn.active { border-color: #d8b29f; background: #fff6f0; }
    .hero-sheet {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #12253a;
    }
    .sheet-stage { position: relative; }
    .hero-sheet img { display: block; width: 100%; height: auto; }
    .sheet-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .sheet-overlay a { cursor: pointer; }
    .sheet-overlay rect {
      fill: rgba(217, 119, 87, 0);
      stroke: rgba(255, 255, 255, 0);
      stroke-width: 2;
      transition: fill 120ms ease, stroke 120ms ease;
    }
    .sheet-overlay a:hover rect,
    .sheet-overlay a:focus rect {
      fill: rgba(217, 119, 87, 0.14);
      stroke: rgba(255, 244, 223, 0.95);
    }
    .sheet-overlay a.current rect {
      fill: rgba(216, 178, 159, 0.16);
      stroke: rgba(255, 244, 223, 1);
      stroke-width: 3;
    }
    .sheet-cap { padding: 10px 12px; color: #dbe6ef; font-size: 13px; }
    .sheet-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <div class="brand">NEXTPRIME <span>pic_editor</span></div>
      <div class="stamp">测试4 / 出图</div>
    </div>
  </header>
  <main class="container">
    <h1>测试4 Contact Sheet</h1>
    <p class="small">这个页面把热点直接叠在 contact sheet 大图上。点击图里的任意卡位，就能直接进入对应的出图评审卡。</p>
    <section class="panel">
      <div class="nav" id="flowNav"></div>
    </section>
    <section class="panel">
      <div class="top-actions">
        <div class="sheet-switch" id="sheetSwitch"></div>
      </div>
      <div class="hero-sheet">
        <div class="sheet-stage">
          <img id="sheetImage" alt="Test 4 contact sheet" />
          <svg id="sheetOverlay" class="sheet-overlay" aria-label="Contact sheet hotspot navigation"></svg>
        </div>
        <div class="sheet-cap" id="sheetCap"></div>
      </div>
      <p class="sheet-note">提示：直接点击大图中的单张卡位进入评审页；当前 hash 命中的卡位会高亮。</p>
    </section>
  </main>
  <script src="../data/production-trace-test4.js"></script>
  <script>
    const data = window.PRODUCTION_TRACE_TEST4_DATA;
    const query = new URLSearchParams(location.search);
    const initialSeries = query.get('series') || 'all';
    const currentId = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    const sheetSwitch = document.getElementById('sheetSwitch');
    const sheetImage = document.getElementById('sheetImage');
    const sheetOverlay = document.getElementById('sheetOverlay');
    const sheetCap = document.getElementById('sheetCap');
    const sheetMap = {
      all: {
        label: 'All 60',
        image: '../assets/images/test4/BFW-WATER4_contact-sheet_v1_2026-04-28.jpg',
        filter: () => true,
        imageWidth: 1610,
        imageHeight: 1126,
        cols: 10,
        startX: 10,
        startY: 10,
        cellW: 150,
        cellH: 171,
        gapX: 10,
        gapY: 15
      },
      I: {
        label: 'I01-I30',
        image: '../assets/images/test4/BFW-WATER4_I_contact-sheet_v1_2026-04-28.jpg',
        filter: (item) => item.test_id.startsWith('I'),
        imageWidth: 1196,
        imageHeight: 1636,
        cols: 5,
        startX: 16,
        startY: 16,
        cellW: 220,
        cellH: 246,
        gapX: 16,
        gapY: 24
      },
      H: {
        label: 'H01-H30',
        image: '../assets/images/test4/BFW-WATER4_H_contact-sheet_v1_2026-04-28.jpg',
        filter: (item) => item.test_id.startsWith('H'),
        imageWidth: 1196,
        imageHeight: 1636,
        cols: 5,
        startX: 16,
        startY: 16,
        cellW: 220,
        cellH: 246,
        gapX: 16,
        gapY: 24
      }
    };
    function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
    function renderOverlay(cfg, items) {
      sheetOverlay.setAttribute('viewBox', `0 0 ${cfg.imageWidth} ${cfg.imageHeight}`);
      sheetOverlay.innerHTML = items.map((item, index) => {
        const col = index % cfg.cols;
        const row = Math.floor(index / cfg.cols);
        const x = cfg.startX + col * (cfg.cellW + cfg.gapX);
        const y = cfg.startY + row * (cfg.cellH + cfg.gapY);
        const isCurrent = item.test_id === currentId;
        return `
          <a class="${isCurrent ? 'current' : ''}" href="t4-step-production.html#${encodeURIComponent(item.test_id)}" aria-label="${esc(item.test_id)}">
            <title>${esc(item.test_id)}</title>
            <rect x="${x}" y="${y}" width="${cfg.cellW}" height="${cfg.cellH}" rx="8" ry="8"></rect>
          </a>
        `;
      }).join('');
    }
    function render(seriesKey) {
      const cfg = sheetMap[seriesKey] || sheetMap.all;
      const items = data.items.filter(cfg.filter);
      sheetSwitch.innerHTML = Object.entries(sheetMap).map(([key, item]) => `
        <a class="sheet-btn ${key === seriesKey ? 'active' : ''}" href="t4-contact-sheet.html?series=${encodeURIComponent(key)}${currentId ? `#${encodeURIComponent(currentId)}` : ''}">${esc(item.label)}</a>
      `).join('');
      sheetImage.src = cfg.image;
      sheetCap.innerHTML = `${esc(cfg.label)} · 点击图内卡位进入评审 · <a href="${esc(cfg.image)}" target="_blank" rel="noopener noreferrer">打开原始 JPG</a>`;
      renderOverlay(cfg, items);
    }
    render(sheetMap[initialSeries] ? initialSeries : 'all');
  </script>
  <script src="../assets/flow-manual.js"></script>
  <script>
    NPFlowManual.renderFlowNav(document.getElementById("flowNav"), "t4", "production");
  </script>
</body>
</html>
