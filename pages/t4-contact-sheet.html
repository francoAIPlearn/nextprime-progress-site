<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>测试4 Contact Sheet | NEXTPRIME</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .top-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .sheet-switch { display: inline-flex; flex-wrap: wrap; gap: 8px; }
    .sheet-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
    }
    .sheet-btn.active { border-color: #d8b29f; background: #fff6f0; }
    .hero-sheet {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #12253a;
    }
    .hero-sheet img { display: block; width: 100%; height: auto; }
    .sheet-cap { padding: 10px 12px; color: #dbe6ef; font-size: 13px; }
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .thumb-card {
      display: block;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      color: inherit;
      text-decoration: none;
    }
    .thumb-card.current { border-color: #d8b29f; box-shadow: 0 0 0 3px #fff1e7; }
    .thumb-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
    .thumb-meta { padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .thumb-meta strong { font-size: 13px; }
    .thumb-meta span { font-size: 12px; color: var(--muted); }
    @media (max-width: 980px) {
      .thumb-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <div class="brand">NEXTPRIME <span>pic_editor</span></div>
      <div class="stamp">Test 4 / Contact Sheet</div>
    </div>
  </header>
  <main class="container">
    <h1>测试4 Contact Sheet 导航</h1>
    <p class="small">点击缩略图可直接跳到对应评审卡；原始 contact sheet JPG 保留为总览图。</p>
    <section class="panel">
      <div class="nav">
        <a href="../index.html">总览首页</a>
        <a href="t4-workflow-index.html">测试4索引</a>
        <a href="t4-step-production.html">返回出图评审</a>
      </div>
    </section>
    <section class="panel">
      <div class="top-actions">
        <div class="sheet-switch" id="sheetSwitch"></div>
      </div>
      <div class="hero-sheet">
        <img id="sheetImage" alt="Test 4 contact sheet" />
        <div class="sheet-cap" id="sheetCap"></div>
      </div>
    </section>
    <section class="panel">
      <h2 id="gridTitle">缩略图导航</h2>
      <div id="thumbGrid" class="thumb-grid"></div>
    </section>
  </main>
  <script src="../data/production-trace-test4.js"></script>
  <script>
    const data = window.PRODUCTION_TRACE_TEST4_DATA;
    const query = new URLSearchParams(location.search);
    const initialSeries = query.get('series') || 'all';
    const currentId = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    const sheetSwitch = document.getElementById('sheetSwitch');
    const sheetImage = document.getElementById('sheetImage');
    const sheetCap = document.getElementById('sheetCap');
    const gridTitle = document.getElementById('gridTitle');
    const thumbGrid = document.getElementById('thumbGrid');
    const sheetMap = {
      all: {
        label: 'All 60',
        image: '../assets/images/test4/BFW-WATER4_contact-sheet_v1_2026-04-28.jpg',
        filter: () => true
      },
      I: {
        label: 'I01-I30',
        image: '../assets/images/test4/BFW-WATER4_I_contact-sheet_v1_2026-04-28.jpg',
        filter: (item) => item.test_id.startsWith('I')
      },
      H: {
        label: 'H01-H30',
        image: '../assets/images/test4/BFW-WATER4_H_contact-sheet_v1_2026-04-28.jpg',
        filter: (item) => item.test_id.startsWith('H')
      }
    };
    function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
    function statusLabel(status){ return status === 'pass' ? '通过' : '待复核'; }
    function render(seriesKey) {
      const cfg = sheetMap[seriesKey] || sheetMap.all;
      const items = data.items.filter(cfg.filter);
      sheetSwitch.innerHTML = Object.entries(sheetMap).map(([key, item]) => `
        <a class="sheet-btn ${key === seriesKey ? 'active' : ''}" href="t4-contact-sheet.html?series=${encodeURIComponent(key)}">${esc(item.label)}</a>
      `).join('');
      sheetImage.src = cfg.image;
      sheetCap.innerHTML = `${esc(cfg.label)} · <a href="${esc(cfg.image)}" target="_blank" rel="noopener noreferrer">打开原始 JPG</a>`;
      gridTitle.textContent = `${cfg.label} 缩略图导航`;
      thumbGrid.innerHTML = items.map((item) => `
        <a class="thumb-card ${item.test_id === currentId ? 'current' : ''}" id="${esc(item.test_id)}" href="t4-step-production.html#${encodeURIComponent(item.test_id)}">
          <img src="${esc(item.output_file)}" alt="${esc(item.variant_id)}" />
          <div class="thumb-meta">
            <strong>${esc(item.test_id)}</strong>
            <span>${statusLabel(item.status)}</span>
          </div>
        </a>
      `).join('');
    }
    render(sheetMap[initialSeries] ? initialSeries : 'all');
  </script>
</body>
</html>
