<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>测试3 出图评审 | NEXTPRIME</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../assets/review-widget.css" />
  <style>
    .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
    .side, .detail { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .tree { max-height: calc(100vh - 190px); overflow: auto; }
    .btn { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; }
    .btn.active { border-color: #d8b29f; background: #fff6f0; font-weight: 600; }
    .preview { width: min(520px, 100%); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
    .preview img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
    .preview figcaption { padding: 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
    .badge { display: inline-block; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; font-size: 12px; background: #f8f8f8; margin-left: 6px; }
    .badge.primary { color: #1f7a4f; background: #eaf8f0; border-color: #bde8cd; }
    .badge.review { color: #a16207; background: #fff4df; border-color: #f2d69a; }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } .tree { max-height: none; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="inner"><div class="brand">NEXTPRIME <span>pic_editor</span></div><div class="stamp">Test 3 / 出图评审</div></div></header>
  <main class="container">
    <h1>测试3出图评审</h1>
    <p class="small">BFW-WATER3：10张 bold / clean / premium 水感图。点击节点后可查看图、prompt、需求单，并记录评论、勾选、评分和附件。</p>
    <section class="panel"><div class="nav">
      <a href="../index.html">总览首页</a>
      <a href="t3-output.html">测试3一版图</a>
      <a class="active" href="t3-step-production.html">出图评审</a>
      <a href="../docs/test3/测试总表_test3.md">测试总表</a>
      <a href="../docs/test3/qa/QA_checklist.md">QA Checklist</a>
      <a href="../docs/test3/run-log.md">Run Log</a>
    </div></section>
    <section class="panel"><h2>Contact Sheet</h2><p><a href="../assets/images/test3/BFW-WATER3_contact-sheet_v1_2026-04-28.jpg">打开测试3接触表</a></p></section>
    <section class="layout"><aside class="side"><h2>Image Nodes</h2><div id="tree" class="tree"></div></aside><section class="detail"><h2>Detail</h2><div id="detail" class="small">Loading...</div></section></section>
  </main>
  <script src="../data/production-trace-test3.js"></script>
  <script src="../assets/review-widget.js"></script>
  <script>
    const data = window.PRODUCTION_TRACE_TEST3_DATA;
    const tree = document.getElementById("tree");
    const detail = document.getElementById("detail");
    function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");}
    function render(item){
      document.querySelectorAll(".btn").forEach((b)=>b.classList.toggle("active", b.dataset.id===item.test_id));
      const notes = (item.qa_notes&&item.qa_notes.length) ? item.qa_notes.map((n)=>`<li>${esc(n)}</li>`).join("") : "<li>OK</li>";
      detail.innerHTML = `<figure class="preview"><img src="${esc(item.output_file)}" alt="${esc(item.variant_id)}"><figcaption>${esc(item.variant_id)} <span class="badge ${esc(item.status)}">${esc(item.status)}</span></figcaption></figure><h3>${esc(item.water_effect_type)}</h3><ul><li><a href="${esc(item.prompt_file)}">Prompt</a></li><li><a href="${esc(item.requirement_file)}">Requirement</a></li><li><a href="../docs/test3/qa/QA_checklist.md">QA checklist</a></li></ul><h3>QA Notes</h3><ul>${notes}</ul><div id="npReviewMount"></div>`;
      window.NPReviewWidget.mount("npReviewMount", { itemId: `test3-${item.variant_id}`, title: item.variant_id });
    }
    if(!data || !Array.isArray(data.items)){ detail.textContent="Data failed to load."; }
    else { tree.innerHTML = data.items.map((item)=>`<button class="btn" data-id="${esc(item.test_id)}">${esc(item.test_id)} - ${esc(item.water_effect_type)} <span class="badge ${esc(item.status)}">${esc(item.status)}</span></button>`).join(""); document.querySelectorAll(".btn").forEach((btn)=>btn.addEventListener("click",()=>render(data.items.find((i)=>i.test_id===btn.dataset.id)))); render(data.items[0]); }
  </script>
</body>
</html>
