<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEXTPRIME 图文制作进度看板</title>
  <style>
    :root {
      --bg: #f8f6f3;
      --panel: #ffffff;
      --ink: #1f1f1f;
      --muted: #6f6f6f;
      --accent: #d97757;
      --border: #e7e1db;
      --ok: #1f7a4f;
      --doing: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 0%, #fffdfb 0%, var(--bg) 52%);
      line-height: 1.55;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(17, 17, 17, 0.92);
      border-bottom: 1px solid #2a2a2a;
      color: #f7f7f7;
    }
    .topbar-inner, .container { width: min(1120px, 92vw); margin: 0 auto; }
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; height: 56px; }
    .brand { font-weight: 700; letter-spacing: 0.08em; }
    .brand span { color: var(--accent); }
    .stamp { color: #bfbfbf; font-size: 13px; }
    .hero { padding: 28px 0 16px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 3.2vw, 40px); }
    .lead { margin: 0; color: var(--muted); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 14px 0;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 17px;
      border-left: 3px solid var(--accent);
      padding-left: 9px;
    }
    .test-switch { display: inline-flex; gap: 8px; }
    .test-btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      cursor: pointer;
    }
    .test-btn.active {
      border-color: #d8b29f;
      background: #fff6f0;
      font-weight: 600;
    }
    .workflow { display: grid; grid-template-columns: repeat(7, minmax(118px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .step {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      min-height: 86px;
      background: #fffcf8;
      text-decoration: none;
      color: var(--ink);
      display: block;
    }
    .step:hover { border-color: #d2b3a0; background: #fff9f4; }
    .name { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .meta { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .done { color: var(--ok); background: #eaf8f0; border: 1px solid #bde8cd; }
    .doing { color: var(--doing); background: #fff4df; border: 1px solid #f2d69a; }
    .todo { color: #6b7280; background: #f3f4f6; border: 1px solid #e5e7eb; }
    .small { color: var(--muted); font-size: 14px; }
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th, .table td { border-bottom: 1px solid var(--border); text-align: left; padding: 8px 6px; vertical-align: top; }
    .table th { background: #faf8f5; font-weight: 600; }
    .gallery { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
    .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
    .cap { padding: 6px 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
    a { color: #b65f44; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (max-width: 960px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">NEXTPRIME <span>pic_editor</span></div>
      <div class="stamp">更新日期：2026-04-27</div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>图文制作流程总览</h1>
      <p class="lead">同一套流程框架，支持 Test 1 与 Test 2 独立切换查看。Test 2 已改为固定产品原图主体，仅测试水感视觉变量。</p>
    </section>

    <section class="panel">
      <h2>测试切换</h2>
      <div class="test-switch" role="tablist" aria-label="测试切换">
        <button id="switch-t1" class="test-btn active" type="button">测试1（A1~B2）</button>
        <button id="switch-t2" class="test-btn" type="button">测试2（W01~W10）</button>
      </div>
    </section>

    <section class="panel">
      <h2 id="flow-title">流程状态 - 测试1</h2>
      <div id="workflow" class="workflow"></div>
    </section>

    <section class="panel">
      <h2 id="summary-title">当前进度 - 测试1</h2>
      <ul id="summary-list" class="small"></ul>
    </section>

    <section class="panel">
      <h2 id="doc-title">关键文档 - 测试1</h2>
      <table class="table">
        <thead>
          <tr><th>类型</th><th>入口</th><th>说明</th></tr>
        </thead>
        <tbody id="doc-body"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2 id="gallery-title">预览</h2>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <script>
    const testConfig = {
      t1: {
        name: "测试1",
        flowTitle: "流程状态 - 测试1",
        summaryTitle: "当前进度 - 测试1",
        docTitle: "关键文档 - 测试1",
        galleryTitle: "测试1图稿预览（A1~B2 v2）",
        steps: [
          ["方向梳理", "pages/step-direction.html", "已完成", "查看：方向目标与边界"],
          ["变量拆解", "pages/step-variables.html", "已完成", "查看：控制组/变化组结构"],
          ["AB 测试方案", "pages/step-ab-plan.html", "已完成", "查看：首轮方案与判读规则"],
          ["资产检查", "pages/step-asset-check.html", "已完成", "查看：就绪资产与缺口"],
          ["测试图需求单", "pages/step-requirements.html", "已完成", "查看：A1~B2 执行要求"],
          ["出图", "pages/step-production.html", "进行中", "查看：出图追溯树"],
          ["复盘迭代", "pages/step-review.html", "待执行", "查看：指标回填与下一步"]
        ],
        summary: [
          "承接文档、测试总表、4张需求单、复盘表已落地。",
          "首轮4图 v1/v2 均已归档，树状追溯已可查看。",
          "复盘指标固定：CTR、CTR(link click)、ROAS、CVR。"
        ],
        docs: [
          ["流程索引", "pages/workflow-index.html", "7个环节入口与说明"],
          ["测试总表", "docs/测试总表.md", "A1/A2/B1/B2 总表"],
          ["需求单", "docs/requirements/01_A1_需求单.md", "首轮需求单目录"],
          ["复盘表", "docs/复盘表.csv", "测试1复盘记录"],
          ["出图追溯", "pages/step-production.html", "树状追溯详情"]
        ],
        gallery: [
          ["assets/images/BFW-WATER-A1_v2_2026-04-26.png", "A1 v2"],
          ["assets/images/BFW-WATER-A2_v2_2026-04-26.png", "A2 v2"],
          ["assets/images/BFW-WATER-B1_v2_2026-04-26.png", "B1 v2"],
          ["assets/images/BFW-WATER-B2_v2_2026-04-26.png", "B2 v2"]
        ]
      },
      t2: {
        name: "测试2",
        flowTitle: "流程状态 - 测试2",
        summaryTitle: "当前进度 - 测试2",
        docTitle: "关键文档 - 测试2",
        galleryTitle: "测试2图稿预览（W01~W10）",
        steps: [
          ["方向梳理", "pages/t2-step-direction.html", "已完成", "仅做水感视觉变量测试"],
          ["变量拆解", "pages/t2-step-variables.html", "已完成", "W01~W10 单变量定义"],
          ["视觉对比方案", "pages/t2-step-ab-plan.html", "已完成", "不做功效AB，仅水感对比"],
          ["资产检查", "pages/t2-step-asset-check.html", "已完成", "锁定正面原图为唯一主体"],
          ["测试图需求单", "pages/t2-step-requirements.html", "已完成", "10张需求单与主体锁定条款"],
          ["出图", "pages/t2-step-production.html", "进行中", "W01~W10 树状追溯"],
          ["复盘迭代", "pages/t2-step-review.html", "待执行", "仅填CTR/CTR(link click)/ROAS/CVR"]
        ],
        summary: [
          "测试2与测试1完全并行，路由和内容互不影响。",
          "出图方法改为固定正面原图编辑，不再重绘产品主体。",
          "10张图统一标题：all-roundeer brightening cleanser / 10S Brighter and clearer skin。"
        ],
        docs: [
          ["流程索引", "pages/t2-workflow-index.html", "测试2的7个环节索引"],
          ["测试2总表", "docs/test2/测试总表_test2.md", "W01~W10 总表"],
          ["测试2需求单", "docs/test2/requirements/W01_需求单.md", "10张需求单入口"],
          ["测试2复盘表", "docs/test2/复盘表_test2.csv", "测试2复盘记录"],
          ["测试2出图追溯", "pages/t2-step-production.html", "W01~W10树状追溯"]
        ],
        gallery: [
          ["assets/images/test2/BFW-WATER2-W01_v1_2026-04-27.png", "W01"],
          ["assets/images/test2/BFW-WATER2-W02_v1_2026-04-27.png", "W02"],
          ["assets/images/test2/BFW-WATER2-W03_v1_2026-04-27.png", "W03"],
          ["assets/images/test2/BFW-WATER2-W04_v1_2026-04-27.png", "W04"],
          ["assets/images/test2/BFW-WATER2-W05_v1_2026-04-27.png", "W05"]
        ]
      }
    };

    function tagClass(status) {
      if (status === "已完成") return "done";
      if (status === "进行中") return "doing";
      return "todo";
    }

    function render(key) {
      const cfg = testConfig[key];
      document.getElementById("flow-title").textContent = cfg.flowTitle;
      document.getElementById("summary-title").textContent = cfg.summaryTitle;
      document.getElementById("doc-title").textContent = cfg.docTitle;
      document.getElementById("gallery-title").textContent = cfg.galleryTitle;

      const flow = document.getElementById("workflow");
      flow.innerHTML = cfg.steps.map((s) => `
        <a class="step" href="${s[1]}">
          <div class="name">${s[0]}</div>
          <span class="tag ${tagClass(s[2])}">${s[2]}</span>
          <span class="meta">${s[3]}</span>
        </a>
      `).join("");

      const summary = document.getElementById("summary-list");
      summary.innerHTML = cfg.summary.map((s) => `<li>${s}</li>`).join("");

      const docs = document.getElementById("doc-body");
      docs.innerHTML = cfg.docs.map((d) => `
        <tr>
          <td>${d[0]}</td>
          <td><a href="${d[1]}" target="_blank" rel="noopener noreferrer">${d[1]}</a></td>
          <td>${d[2]}</td>
        </tr>
      `).join("");

      const gallery = document.getElementById("gallery");
      gallery.innerHTML = cfg.gallery.map((g) => `
        <figure class="card">
          <img src="${g[0]}" alt="${g[1]}" />
          <figcaption class="cap">${g[1]}</figcaption>
        </figure>
      `).join("");

      document.getElementById("switch-t1").classList.toggle("active", key === "t1");
      document.getElementById("switch-t2").classList.toggle("active", key === "t2");
    }

    document.getElementById("switch-t1").addEventListener("click", () => render("t1"));
    document.getElementById("switch-t2").addEventListener("click", () => render("t2"));
    render("t1");
  </script>
</body>
</html>
