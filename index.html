<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEXTPRIME 图文制作进度看板</title>
  <style>
    :root {
      --bg: #f8f6f3;
      --panel: #ffffff;
      --ink: #1f1f1f;
      --muted: #6f6f6f;
      --accent: #d97757;
      --border: #e7e1db;
      --ok: #1f7a4f;
      --doing: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 0%, #fffdfb 0%, var(--bg) 52%);
      line-height: 1.55;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(17, 17, 17, 0.92);
      border-bottom: 1px solid #2a2a2a;
      color: #f7f7f7;
    }
    .topbar-inner, .container { width: min(1120px, 92vw); margin: 0 auto; }
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; height: 56px; }
    .brand { font-weight: 700; letter-spacing: 0.08em; }
    .brand span { color: var(--accent); }
    .stamp { color: #bfbfbf; font-size: 13px; }
    .hero { padding: 28px 0 16px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 3.2vw, 40px); }
    .lead { margin: 0; color: var(--muted); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 14px 0;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 17px;
      border-left: 3px solid var(--accent);
      padding-left: 9px;
    }
    .test-switch { display: inline-flex; flex-wrap: wrap; gap: 8px; }
    .test-btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      cursor: pointer;
    }
    .test-btn.active {
      border-color: #d8b29f;
      background: #fff6f0;
      font-weight: 600;
    }
    .workflow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .step {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      min-height: 124px;
      background: #fffcf8;
      text-decoration: none;
      color: var(--ink);
      display: block;
    }
    .step:hover { border-color: #d2b3a0; background: #fff9f4; }
    .name { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .meta { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .done { color: var(--ok); background: #eaf8f0; border: 1px solid #bde8cd; }
    .doing { color: var(--doing); background: #fff4df; border: 1px solid #f2d69a; }
    .todo { color: #6b7280; background: #f3f4f6; border: 1px solid #e5e7eb; }
    .step.manual {
      border-color: #efc38c;
      background: #fffaf2;
      box-shadow: inset 0 0 0 1px rgba(239, 195, 140, 0.28);
    }
    .step-note {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .manual-chip {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #efc38c;
      background: #fff3df;
      color: #8a5600;
      font-size: 12px;
      font-weight: 600;
    }
    .small { color: var(--muted); font-size: 14px; }
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th, .table td { border-bottom: 1px solid var(--border); text-align: left; padding: 8px 6px; vertical-align: top; }
    .table th { background: #faf8f5; font-weight: 600; }
    .gallery { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
    .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
    .cap { padding: 6px 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
    a { color: #b65f44; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (max-width: 960px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">NEXTPRIME <span>pic_editor</span></div>
      <div class="stamp">正式版 v1.0.0 · 更新日期：2026-05-07</div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>图文制作流程总览</h1>
      <p class="lead">同一套流程框架支持 Test 1~Test 4 独立查看。测试4的内容已收口到统一流程页、出图评审、Contact Sheet 和文档索引中。</p>
    </section>

    <section class="panel">
      <h2>测试切换</h2>
      <div class="test-switch" role="tablist" aria-label="测试切换">
        <button id="switch-t1" class="test-btn active" type="button">测试1（A1~B2）</button>
        <button id="switch-t2" class="test-btn" type="button">测试2（W01~W10）</button>
        <button id="switch-t3" class="test-btn" type="button">测试3（W01~W10）</button>
        <button id="switch-t4" class="test-btn" type="button">测试4（I/H 60图）</button>
      </div>
    </section>

    <section class="panel">
      <h2 id="flow-title">流程状态 - 测试1</h2>
      <div id="workflow" class="workflow"></div>
    </section>

    <section class="panel">
      <h2 id="summary-title">当前进度 - 测试1</h2>
      <ul id="summary-list" class="small"></ul>
    </section>

    <section class="panel">
      <h2 id="doc-title">关键文档 - 测试1</h2>
      <table class="table">
        <thead>
          <tr><th>类型</th><th>入口</th><th>说明</th></tr>
        </thead>
        <tbody id="doc-body"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2 id="gallery-title">预览</h2>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <script src="assets/flow-manual.js"></script>
  <script>

        summary: [
          "承接文档、测试总表、4张需求单、复盘表已落地。",
          "首轮4图 v1/v2 均已归档，树状追溯已可查看。",
          "复盘指标固定：CTR、CTR(link click)、ROAS、CVR。"
        ],
        docs: [
          ["流程索引", "pages/workflow-index.html", "7个环节入口与说明"],

          ["需求单", "docs/requirements/01_A1_需求单.md", "首轮需求单目录"],
          ["复盘表", "docs/复盘表.csv", "测试1复盘记录"],

        ],

          ["assets/images/BFW-WATER-A1_v2_2026-04-26.png", "A1 v2"],
          ["assets/images/BFW-WATER-A2_v2_2026-04-26.png", "A2 v2"],
          ["assets/images/BFW-WATER-B1_v2_2026-04-26.png", "B1 v2"],
          ["assets/images/BFW-WATER-B2_v2_2026-04-26.png", "B2 v2"]
        ]
      },
      t2: {
        name: "测试2",
        flowTitle: "流程状态 - 测试2",
        summaryTitle: "当前进度 - 测试2",
        docTitle: "关键文档 - 测试2",

        summary: [

          ["测试2需求单", "docs/test2/requirements/W01_需求单.md", "10张需求单入口"],

        ],
        gallery: [
          ["assets/images/test2/BFW-WATER2-W01_v1_2026-04-27.png", "W01"],
          ["assets/images/test2/BFW-WATER2-W02_v1_2026-04-27.png", "W02"],
          ["assets/images/test2/BFW-WATER2-W03_v1_2026-04-27.png", "W03"],
          ["assets/images/test2/BFW-WATER2-W04_v1_2026-04-27.png", "W04"],
          ["assets/images/test2/BFW-WATER2-W05_v1_2026-04-27.png", "W05"]
        ]
      },
      t3: {
        name: "测试3",
        flowTitle: "流程状态 - 测试3",
        summaryTitle: "当前进度 - 测试3",
        docTitle: "关键文档 - 测试3",
        galleryTitle: "测试3图稿预览（BFW-WATER3 W01~W10）",
        steps: [
          { id: "direction", label: "方向梳理", href: "pages/t3-output.html#conflict", status: "已完成", summary: "锁定银色 Brightening Face Wash 身份", manual_note: "" },
          { id: "variables", label: "变量拆解", href: "pages/t3-output.html#gallery", status: "已完成", summary: "10个 bold / clean / premium 水感变量", manual_note: "" },
          { id: "plan", label: "视觉对比方案", href: "pages/t3-output.html#pack", status: "已完成", summary: "固定1:1画幅与极简文案", manual_note: "" },
          { id: "assets", label: "资产检查", href: "pages/t3-output.html#pack", status: "已完成", summary: "图稿、prompt、需求单、QA均已归档", manual_note: "" },
          { id: "requirements", label: "测试图需求单", href: "docs/test3/requirements/BFW-WATER3-W01_需求单.md", status: "已完成", summary: "W01~W10 需求单", manual_note: "" },
          { id: "production", label: "出图", href: "pages/t3-step-production.html", status: "进行中", summary: "10张图追溯与评审", manual_note: "人工：逐图评审" },
          { id: "review", label: "复盘迭代", href: "docs/test3/qa/QA_checklist.md", status: "待执行", summary: "优先关注 W05/W09 水量主观感受", manual_note: "人工：复核 W05 / W09 主观风险" }
        ],
        summary: [
          "测试3已发布：10张 v1 输出图、10份 prompt、10份需求单、QA checklist、run log。",
          "产品身份锁定为 Brightening Face Wash 银色包装，水感参考仅迁移冲击/扫过质感。",
          "W05 与 W09 水量最大，投放前建议在出图页评论区单独标注主观风险。"
        ],
        docs: [
          ["测试3总览", "pages/t3-output.html", "测试3一版图、接触表与文件包"],
          ["测试3总表", "docs/test3/测试总表_test3.md", "W01~W10 总表"],
          ["测试3需求单", "docs/test3/requirements/BFW-WATER3-W01_需求单.md", "10张需求单入口"],
          ["QA checklist", "docs/test3/qa/QA_checklist.md", "集中QA标准"],
          ["出图追溯", "pages/t3-step-production.html", "带评论/勾选/评分的出图详情"]
        ],
        gallery: [
          ["assets/images/test3/BFW-WATER3-W01_v1_2026-04-28.png", "W01"],
          ["assets/images/test3/BFW-WATER3-W02_v1_2026-04-28.png", "W02"],
          ["assets/images/test3/BFW-WATER3-W05_v1_2026-04-28.png", "W05"],
          ["assets/images/test3/BFW-WATER3-W09_v1_2026-04-28.png", "W09"],
          ["assets/images/test3/BFW-WATER3-W10_v1_2026-04-28.png", "W10"]
        ]
      },
      t4: {
        name: "测试4",
        flowTitle: "流程状态 - 测试4",
        summaryTitle: "当前进度 - 测试4",
        docTitle: "关键文档 - 测试4",
        galleryTitle: "测试4图稿预览（BFW-WATER4）",
        summary: [
          "测试4首页流程图已恢复为 7 卡展示，页面顶部导航也统一回中文流程结构。",
          "当前产出为 60 张 v1 图：I01~I30 为半浸水/水线方向，H01~H30 为击打/扫过/水幕方向。",
          "Production Review 的文本评语、候选勾选、评分走共享同步；附件优先上传共享，失败时退回浏览器本地。"
        ],
        docs: [
          ["流程总览", "pages/t4-workflow-index.html#direction", "方向、变量、方案、资产合并页"],
          ["出图评审", "pages/t4-step-production.html", "60图单图评审与追溯"],
          ["Contact Sheet", "pages/t4-contact-sheet.html?series=all", "大图热点导航到评审页"],
          ["文档索引", "pages/t4-docs.html#requirements", "需求单、prompt、QA、主表入口"],
          ["审图数据流", "pages/review-dataflow.html", "评审评论到BigQuery的数据链路与任务卡"]
        ],
        gallery: [
          ["assets/images/test4/BFW-WATER4-I17_v1_2026-04-28.png", "I17"],
          ["assets/images/test4/BFW-WATER4-I24_v1_2026-04-28.png", "I24"],
          ["assets/images/test4/BFW-WATER4-I30_v1_2026-04-28.png", "I30"],
          ["assets/images/test4/BFW-WATER4-H01_v1_2026-04-28.png", "H01"],
          ["assets/images/test4/BFW-WATER4-H22_v1_2026-04-28.png", "H22"]
        ]
      }
    };
    const normalizedConfig = window.NPFlowManual.buildHomepageConfigs(testConfig);

    function tagClass(status) {
      if (status === "已完成") return "done";
      if (status === "进行中") return "doing";
      return "todo";
    }

    function render(key) {
      const cfg = normalizedConfig[key];
      document.getElementById("flow-title").textContent = cfg.flowTitle;
      document.getElementById("summary-title").textContent = cfg.summaryTitle;
      document.getElementById("doc-title").textContent = cfg.docTitle;
      document.getElementById("gallery-title").textContent = cfg.galleryTitle;

      const flow = document.getElementById("workflow");
      flow.innerHTML = cfg.steps.map((s) => `
        <a class="step ${window.NPFlowManual.isManualStatus(s.status) ? "manual" : ""}" href="${s.href}">
          <div class="name">${s.label}${window.NPFlowManual.isManualStatus(s.status) ? '<span class="manual-chip">需人工</span>' : ""}</div>
          <span class="tag ${tagClass(s.status)}">${s.status}</span>
          <span class="meta">${s.summary}</span>
          ${window.NPFlowManual.isManualStatus(s.status) && s.manual_note ? `<span class="step-note">${s.manual_note}</span>` : ""}
        </a>
      `).join("");

      const summary = document.getElementById("summary-list");
      summary.innerHTML = cfg.summary.map((s) => `<li>${s}</li>`).join("");

      const docs = document.getElementById("doc-body");
      docs.innerHTML = cfg.docs.map((d) => `
        <tr>
          <td>${d[0]}</td>
          <td><a href="${d[1]}" target="_blank" rel="noopener noreferrer">${d[1]}</a></td>
          <td>${d[2]}</td>
        </tr>
      `).join("");

      const gallery = document.getElementById("gallery");
      gallery.innerHTML = cfg.gallery.map((g) => `
        <figure class="card">
          <img src="${g[0]}" alt="${g[1]}" />
          <figcaption class="cap">${g[1]}</figcaption>
        </figure>
      `).join("");

      ["t1", "t2", "t3", "t4"].forEach((id) => {
        const btn = document.getElementById(`switch-${id}`);
        if (btn) btn.classList.toggle("active", key === id);
      });
    }

    ["t1", "t2", "t3", "t4"].forEach((id) => {
      const btn = document.getElementById(`switch-${id}`);
      if (btn) btn.addEventListener("click", () => render(id));
    });
    render("t1");
  </script>
</body>
</html>
